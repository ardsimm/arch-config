background {
    monitor =
    path = screenshot	 
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(d79921)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    placeholder_text = <i>Password...</i>
    rounding = 10
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ebdbb2ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
