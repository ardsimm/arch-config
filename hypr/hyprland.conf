# =============================================================================
# MONITOR
# =============================================================================
monitor=,preferred,auto,1


# =============================================================================
# INPUT
# =============================================================================
input {
    kb_layout=us
    kb_variant=intl
}


# =============================================================================
# GENERAL
# =============================================================================
general {
    gaps_out = 30 10 10 10
    gaps_in = 5
    border_size = 2
    col.active_border = rgba(d79921ff)
    col.inactive_border = rgba(282828ff)
}


# =============================================================================
# LAYOUT
# =============================================================================
dwindle {
    preserve_split = true
}


# =============================================================================
# MISC
# =============================================================================
misc {
    font_family = JetBrainsMono Nerd Font
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


# =============================================================================
# VISUALS
# =============================================================================
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.1696
    }
    shadow {
        enabled = true
        range = 20
        color = rgba(00000088)
    }
}

# Window rules
windowrule = opacity 0.9 0.85, match:class (.*)
windowrule = size 1200 800, match:float true
windowrule = center 1, match:float true

# Layer rules - notifications
layerrule = blur 1, match:namespace notifications
layerrule = ignore_alpha 0.1, match:namespace notifications

# Layer rules - wofi
layerrule = blur 1, match:namespace wofi
layerrule = ignore_alpha 0.1, match:namespace wofi


# =============================================================================
# ENVIRONMENT
# =============================================================================
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


# =============================================================================
# AUTOSTART
# =============================================================================
exec-once = awww-daemon && awww img /home/ardsimm/images/wallpapers/STScI-01GA6KKWG229B16K4Q38CH3BXS.png
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'gruvbox-dark-gtk'


# =============================================================================
# KEYBINDS - Applications
# =============================================================================
bind = SUPER, T, exec, kitty
bind = SUPER, R, exec, wofi --show drun
bind = SUPER, E, exec, kitty yazi
bind = SUPER, B, exec, brave
bind = SUPER, C, exec, code

# System
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, L, exec, hyprlock
bind = SUPER, A, exec, pavucontrol
bind = SUPER, N, exec, nm-connection-editor
bind = SUPER, P, exec, nwg-look
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy


# =============================================================================
# KEYBINDS - Screenshots
# =============================================================================
bind = SUPER, S, exec, grim - | tee ~/images/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy && notify-send "Grim" "Screenshot saved and copied to clipboard"
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/images/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy && notify-send "Grim" "Screenshot saved and copied to clipboard"


# =============================================================================
# KEYBINDS - Audio
# =============================================================================
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


# =============================================================================
# KEYBINDS - Window management
# =============================================================================
# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move window in tiling grid
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Resize in tiling grid
binde = SUPER CTRL, right, resizeactive, 50 0
binde = SUPER CTRL, left, resizeactive, -50 0
binde = SUPER CTRL, up, resizeactive, 0 -50
binde = SUPER CTRL, down, resizeactive, 0 50


# =============================================================================
# KEYBINDS - Workspaces
# =============================================================================
# Switch to workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5